unbind c-b
set -g prefix c-a

# Terminal capabilities: tell tmux that Kitty supports 24-bit RGB, terminal title setting, and cursor styling
set-option -sa terminal-features 'xterm-kitty:rgb:title:cstyle'
set -g allow-passthrough on

# Vi mode navigation for copy-mode (Ctrl-a [)
set -g mode-keys vi
setw -g mode-keys vi

# Toggle cursor to a solid block (\033[2 q) in copy-mode, reset (\033[0 q) on exit
set-hook -g pane-mode-changed {
    if -F "#{pane_in_mode}" {
        run-shell 'printf "\033[2 q" > #{client_tty} 2>/dev/null || true'
    } {
        run-shell 'printf "\033[0 q" > #{client_tty} 2>/dev/null || true'
    }
}

set-option -g clock-mode-style 12
set -g base-index 1
setw -g pane-base-index 1
set-option -g mouse on

# Terminal title pass-through configuration
set -g set-titles on
set -g set-titles-string "#S: #W (#T)"

setw -g automatic-rename on
setw -g automatic-rename-format "#{pane_current_command}"

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'smart-splits-nvim/backend-tmux'
set -g @plugin 'niksingh710/minimal-tmux-status'
set -g @plugin 'nhdaly/tmux-better-mouse-mode'

# ==============================================================================
# Smart-Splits v3 Navigation & Resize Bindings
# ==============================================================================
# Seamless navigation across Neovim splits and tmux panes
bind-key -n C-h if -F '#{@pane-is-vim}' { send-keys C-h } { select-pane -L }
bind-key -n C-j if -F '#{@pane-is-vim}' { send-keys C-j } { select-pane -D }
bind-key -n C-k if -F '#{@pane-is-vim}' { send-keys C-k } { select-pane -U }
bind-key -n C-l if -F '#{@pane-is-vim}' { send-keys C-l } { select-pane -R }

# Seamless resizing across Neovim splits and tmux panes (<A-h/j/k/l>)
bind-key -n M-h if -F '#{@pane-is-vim}' { send-keys M-h } { resize-pane -L 3 }
bind-key -n M-j if -F '#{@pane-is-vim}' { send-keys M-j } { resize-pane -D 3 }
bind-key -n M-k if -F '#{@pane-is-vim}' { send-keys M-k } { resize-pane -U 3 }
bind-key -n M-l if -F '#{@pane-is-vim}' { send-keys M-l } { resize-pane -R 3 }

# Navigation within tmux copy-mode-vi
bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R

## Keybinds
bind c-h previous-window
bind c-l next-window

# Bind prefix + tab to cycle through panes
bind tab if-shell -F "#{window_zoomed_flag}" "select-pane -t :.+; resize-pane -Z" "select-pane -t :.+"

bind | split-window -h
bind - split-window -v

bind s display-popup -w 85% -h 80% -E "\
    tmux list-sessions -F '#{session_name}' |\
    fzf --reverse \
        --header 'jump-to-session' \
        --preview 'tmux capture-pane -ep -t {}' \
        --preview-window 'right,72%,border-left,nowrap' |\
    xargs tmux switch-client -t"


# Set v to visual mode for copying, and y to yank
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

bind-key r source-file ~/.tmux.conf

run '/usr/share/tmux-plugin-manager/tpm'
