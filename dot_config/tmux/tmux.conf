unbind c-b
set -g prefix c-a

# Terminal capabilities: tell tmux that Kitty supports 24-bit RGB and terminal title setting
set-option -sa terminal-features 'xterm-kitty:rgb:title'
set -g allow-passthrough on

set-option -g clock-mode-style 12
set -g base-index 1
setw -g pane-base-index 1
set-option -g mouse on

# Terminal title pass-through configuration
set -g set-titles on
set -g set-titles-string "#S: #W (#T)"

setw -g automatic-rename on
setw -g automatic-rename-format "#{pane_current_command}"

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'mrjones2014/smart-splits.nvim'
set -g @plugin 'niksingh710/minimal-tmux-status'
set -g @plugin 'nhdaly/tmux-better-mouse-mode'

## Keybinds
bind c-h previous-window
bind c-l next-window

# Bind prefix + tab to cycle through panes
bind tab if-shell -F "#{window_zoomed_flag}" "select-pane -t :.+; resize-pane -Z" "select-pane -t :.+"

bind | split-window -h
bind - split-window -v

bind s display-popup -E "\
    tmux list-sessions -F '#{session_name}' |\
    fzf --reverse --header 'jump-to-session' --preview 'tmux capture-pane -pt {}' |\
    xargs tmux switch-client -t"

# Toggle a floating, persistent terminal session using Prefix + g
bind-key g run-shell 'if [ "$(tmux display-message -p "#S")" = "scratch" ]; then tmux detach-client; else tmux display-popup -w 80% -h 80% -E "tmux attach -t scratch || tmux new-session -s scratch"; fi'

# Set v to visual mode for copying, and y to yank
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

bind-key r source-file ~/.tmux.conf

run '/usr/share/tmux-plugin-manager/tpm'
